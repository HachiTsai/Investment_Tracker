# 控制迴路卡片：50萬被動股利閉環目標迴路
id: "card:loop:dividend_500k"
kind: "control_loop"
title: "年被動股利 50 萬 TWD 閉環控制迴路"

hierarchy:
  role: "master_loop"              # 主目標迴路（ISA-88/95 控制層級：全資產現金流目標）
  slave_units:
    - "card:ticker:00882"          # 核心收息主力單元（242 張，見 2026-11-02 快照）
    - "card:ticker:00406A"         # 現金流衛星導流單元（100 張，月配息跨池養核心）
  future_expansion_units:
    - "card:ticker:00956"          # 日股高息核心預留副迴路單元
    - "card:ticker:00937B"         # 投等債防禦核心預留副迴路單元
    - "card:ticker:00945B"         # 非投等債收息預留副迴路單元

parameters:
  setpoint_sp: 500000.0            # 目標設定值 (SP, 單位 TWD/年)
  target_currency: "TWD"
  pv_formula: "holding_shares * annual_dividend"   # annual_dividend：近 12 個月實際配息（毛額，不套用稅率）
  error_formula: "max(0.0, setpoint_sp - pv)"

controllers:
  reinvestment_policy:
    mode: "auto"
    action: "下期除息實收現金流 100% 執行再投入 (Reinvest)"
    odd_lot_handling: "整張優先，剩餘款項保留於現金緩衝池"
  capital_injection_eval:
    formula: "error / (annual_dividend / current_price)"
    description: "在當前價格與近 12 個月配息殖利率下，一次性補足缺口所需之理論追加本金"

snowball_simulator:
  # base_shares 不存放於 REPO（持股數屬個人財務資料）；個股深潛請用 --shares 帶入
  reinvest_frequency_months: 6     # 半年滾動一次 (每年 1 月、7 月)
