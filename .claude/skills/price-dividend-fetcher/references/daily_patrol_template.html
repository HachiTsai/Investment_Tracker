<title>每日投資組合巡檢</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面：上方狀態摘要，下方依需要留意程度排序的觀察清單 */
:root{--bg:#f6f7f5;--fg:#1b2420;--mute:#5d6a63;--line:#d9dfda;--card:#ffffff;--accent:#1f6f54;
--over:#b8641a;--down:#b3372f;--up:#2a6fb0;--over-bg:#fbeedd;--down-bg:#f8e1df;--up-bg:#e1edf8;--none-bg:#eceeec;
--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--fg:#e4eae6;--mute:#93a39a;--line:#2a3630;--card:#18211d;--accent:#5fc19a;
--over:#e8a15c;--down:#ee8a82;--up:#82b7e8;--over-bg:#3a2a18;--down-bg:#3a1e1c;--up-bg:#18293a;--none-bg:#222c27;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111815;--fg:#e4eae6;--mute:#93a39a;--line:#2a3630;--card:#18211d;--accent:#5fc19a;
--over:#e8a15c;--down:#ee8a82;--up:#82b7e8;--over-bg:#3a2a18;--down-bg:#3a1e1c;--up-bg:#18293a;--none-bg:#222c27;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-size:26px;margin:0;letter-spacing:.02em}
.sub{color:var(--mute);margin:4px 0 0;font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 16px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sum{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 14px;display:flex;gap:10px;align-items:baseline}
.chip b{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:1180px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mute);letter-spacing:.06em;font-weight:500;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
tr:last-child td{border-bottom:0}
.name small{display:block;color:var(--mute);font:11px var(--mono)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px}
.s-OVERHEATED{background:var(--over-bg);color:var(--over)}.s-DOWNTREND{background:var(--down-bg);color:var(--down)}
.s-UPTREND{background:var(--up-bg);color:var(--up)}.s-OVERSOLD_WATCH{background:var(--up-bg);color:var(--accent)}
.s-NEUTRAL,.s-NO_DATA,.s-ERROR{background:var(--none-bg);color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.lbl{color:var(--mute);font-size:13px;margin-right:4px}
th[data-k]{cursor:pointer}th[data-k]:hover{color:var(--fg)}
.sc{display:inline-block;min-width:38px;padding:1px 6px;border-radius:4px;text-align:center;font-family:var(--mono);font-size:13px}
.hi{background:var(--up-bg);color:var(--up)}.lo{background:var(--down-bg);color:var(--down)}.mid{background:var(--none-bg);color:var(--mute)}
.warn{border:1px solid var(--over);background:var(--over-bg);color:var(--over);border-radius:6px;padding:8px 14px;font-size:14px}
.mac{color:var(--mute);font-size:13px}.stale{opacity:.8}.lag{color:var(--over);font-size:11px;margin-left:6px}
.star{font:inherit;background:none;border:0;padding:0 4px 0 0;cursor:pointer;color:var(--mute);line-height:1}.star.on{color:#e0a100}.star:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.row-click{cursor:pointer}.row-click:hover td{background:var(--none-bg)}
.ih{font:inherit;background:none;border:1px solid var(--line);color:var(--mute);border-radius:99px;width:15px;height:15px;padding:0;font-size:10px;line-height:13px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin-left:4px;vertical-align:middle;transition:border-color .15s,color .15s}
.ih:hover{border-color:var(--accent);color:var(--accent);background:var(--none-bg)}
.ih:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.h-box{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;max-width:500px;width:100%;max-height:85vh;overflow:auto;padding:18px 22px;font-size:14px;line-height:1.75;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.h-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.h-head b{font-size:17px;color:var(--fg);letter-spacing:.02em}
.h-sec{margin-bottom:14px}
.h-sec:last-child{margin-bottom:0}
.h-tit{font-weight:600;color:var(--accent);font-size:13.5px;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.h-sec p{margin:0 0 6px 0;color:var(--fg);font-size:13.5px}
.h-sec ul{margin:4px 0 0 0;padding-left:18px;color:var(--fg);font-size:13px}
.h-sec li{margin-bottom:4px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:9}
.mask.on{display:flex}.dlg{background:var(--card);border:1px solid var(--line);border-radius:8px;width:min(820px,100%);padding:16px 18px}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.dh h2{margin:0;font-size:20px}
.x{font:inherit;background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:2px 10px;cursor:pointer}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px;margin:10px 0;font-size:13px;color:var(--mute);align-items:center}
.opts label{display:flex;gap:4px;align-items:center;cursor:pointer}.opts select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin:10px 0;font-size:13px}.kv span{color:var(--mute)}.kv b{font:500 14px var(--mono)}
svg.ch{width:100%;height:auto;display:block}.ax{fill:var(--mute);font:10px var(--mono)}
main{zoom:var(--z,1)}.dlg{zoom:var(--z,1);width:min(820px,calc((100vw - 24px) / var(--z,1)));resize:both;overflow:auto;min-width:min(360px,100%);max-width:calc((100vw - 24px) / var(--z,1))}
.hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.zc{display:flex;gap:4px;align-items:center}.zc button{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;min-width:34px;padding:3px 8px;cursor:pointer}
.zc button:disabled{opacity:.4;cursor:default}.zc .zp{min-width:56px;font:13px var(--mono)}

.pnl{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:12px 14px}
.hm td,.hm th{text-align:center}.hm td:first-child,.hm th:first-child{text-align:left}.hm table{min-width:420px}
.hm td.c{font:500 13px var(--mono);min-width:64px}
.chg{display:block;font:11px var(--mono)}.chg.u{color:var(--down)}.chg.d{color:var(--accent)}.live{color:var(--accent)}
.qd{width:100%;height:auto;display:block}.qd text{fill:var(--mute);font:10px var(--mono);pointer-events:none}.qd .pt{cursor:pointer}.qd .lb{display:none}.qd .pt:hover .lb{display:block;fill:var(--fg);font-weight:600}.qd .pt:hover circle.dot{stroke:var(--fg)}.qd .pt:hover{stroke:var(--fg);stroke-width:2}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin:8px 0 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.dtabs{display:flex;gap:6px;margin:10px 0}.dtabs .tab{padding:3px 14px}.mx{width:100%;border-collapse:collapse;min-width:0;margin:8px 0}.mx th,.mx td{text-align:center;padding:6px 8px;font-size:13px}.mx td:first-child,.mx th:first-child{text-align:left}.mx td.c{font:500 13px var(--mono)}
.fl .lb.on{display:block;fill:var(--fg)}.fl .pt:hover path{stroke-width:3.2}.fl .pt{cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;display:none;white-space:nowrap;z-index:2}
.hl{cursor:pointer;border-bottom:1px dotted var(--mute)}.hl:hover{color:var(--accent);border-bottom-color:var(--accent)}
#fpdlg,#tcdlg{max-width:560px;width:calc(100% - 32px);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:16px 18px;max-height:85vh}#fpdlg::backdrop,#tcdlg::backdrop{background:rgba(0,0,0,.45)}#fpdlg h4,#tcdlg h4{margin:12px 0 4px;font-size:13px;color:var(--mute)}#fpdlg label,#tcdlg label{display:inline-flex;gap:4px;align-items:center;margin:2px 14px 2px 0;font-size:14px;cursor:pointer}
[hidden]{display:none!important}
</style>
<main>
<header class="hd"><div><h1>每日投資組合巡檢</h1><p class="sub" id="meta"></p><p class="sub"><button type="button" class="x" id="qbtn" hidden>更新最新報價</button> <span id="qst"></span></p></div><div class="zc" role="group" aria-label="畫面縮放"><button type="button" data-z="o" aria-label="縮小" title="縮小">−</button><button type="button" data-z="r" class="zp" title="還原 100%"></button><button type="button" data-z="i" aria-label="放大" title="放大">＋</button></div></header>
<div id="warn"></div>
<div class="row"><span class="lbl">地區</span><span class="row" id="mk"></span></div>
<div class="row"><span class="lbl">類型</span><span class="row" id="kd"></span></div>
<div class="row"><span class="lbl">收藏</span><span class="row" id="fv"></span><span class="mac" id="fvs"></span></div>
<div class="row"><span class="lbl">搜尋</span><input type="search" id="q" placeholder="股號、名稱或關鍵字（如 0056、高股息、偏多，空白分隔為且）" autocomplete="off" style="flex:1;min-width:200px;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 16px"></div>
<section class="sum" id="sum" aria-label="狀態統計"></section>
<div class="row"><span class="lbl">檢視</span><span class="row" id="vw"></span></div>
<div class="row" id="tcrow"><button type="button" class="x" id="tcbtn">選擇指標欄位</button><span class="mac" id="tcinfo"></span><span class="mac">表格檢視可用，設定記在這個瀏覽器</span></div>
<div class="tw" id="vTable"><table><thead><tr>
<th data-k="name">標的 <button type="button" class="ih" data-help="name" title="標的說明" aria-label="標的說明">?</button></th><th data-k="state">波段狀態 <button type="button" class="ih" data-help="state" title="波段狀態 指標說明" aria-label="波段狀態 指標說明">?</button></th><th data-k="posture_label">配置狀態 <button type="button" class="ih" data-help="posture" title="配置狀態 指標說明" aria-label="配置狀態 指標說明">?</button></th><th data-k="close">最新報價 <button type="button" class="ih" data-help="close" title="最新報價 指標說明" aria-label="最新報價 指標說明">?</button></th><th data-k="yield_pct">殖利率 <button type="button" class="ih" data-help="yield" title="殖利率 指標說明" aria-label="殖利率 指標說明">?</button></th>
<th data-k="rsi14">RSI14 <button type="button" class="ih" data-help="rsi" title="RSI14 指標說明" aria-label="RSI14 指標說明">?</button></th><th data-k="pos_52w_pct">52週位置 <button type="button" class="ih" data-help="p52" title="52週位置 指標說明" aria-label="52週位置 指標說明">?</button></th><th data-k="fib_label">費波那契位置 <button type="button" class="ih" data-help="fib" title="費波那契位置 指標說明" aria-label="費波那契位置 指標說明">?</button></th><th>長／中／短期 <button type="button" class="ih" data-help="lms" title="長／中／短期 指標說明" aria-label="長／中／短期 指標說明">?</button></th><th data-k="combo">三週期組合 <button type="button" class="ih" data-help="combo" title="三週期組合 指標說明" aria-label="三週期組合 指標說明">?</button></th>
<th data-k="trend_score">趨勢 <button type="button" class="ih" data-help="trend" title="趨勢評分 指標說明" aria-label="趨勢評分 指標說明">?</button></th><th data-k="macd_score">動能 <button type="button" class="ih" data-help="macd" title="動能評分 指標說明" aria-label="動能評分 指標說明">?</button></th><th data-k="vol_score">量能 <button type="button" class="ih" data-help="vol" title="量能評分 指標說明" aria-label="量能評分 指標說明">?</button></th><th data-k="return_score">績效 <button type="button" class="ih" data-help="ret" title="績效評分 指標說明" aria-label="績效評分 指標說明">?</button></th><th data-k="total_score">綜合 <button type="button" class="ih" data-help="total" title="綜合評分 指標說明" aria-label="綜合評分 指標說明">?</button></th><th data-k="stop_distance_pct">2×ATR停損 <button type="button" class="ih" data-help="stop" title="2×ATR停損 指標說明" aria-label="2×ATR停損 指標說明">?</button></th>
</tr></thead><tbody id="rows"></tbody></table></div>
<div class="tw hm" id="vMatrix" hidden></div>
<div class="pnl" id="vQuad" hidden></div>
<div class="pnl" id="vFlow" hidden></div>
<dialog id="fpdlg" aria-label="選擇標的"><div class="hd"><h2 style="margin:0;font-size:18px">選擇標的</h2><button type="button" class="x" id="fpx">完成</button></div><p class="mac">動態檢視只播放選到的標的，設定記在這個瀏覽器。按組合可一次選取，也可以逐檔勾選。<span id="fpn"></span></p><div class="row" id="fpg"></div><p class="row"><button type="button" class="x" id="fpall">全選</button><button type="button" class="x" id="fpnone">全部取消</button><input type="search" id="fpq" placeholder="搜尋名稱或股號" autocomplete="off" style="flex:1;min-width:140px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 12px"></p><div id="fpl"></div></dialog>
<dialog id="tcdlg" aria-label="選擇指標欄位"><div class="hd"><h2 style="margin:0;font-size:18px">選擇指標欄位</h2><button type="button" class="x" id="tcx">完成</button></div><p class="mac">標的名稱固定顯示。按群組可一次加入或移除，也可以逐欄勾選。</p><p class="row"><button type="button" class="x" id="tcall">全部欄位</button><button type="button" class="x" id="tcnone">全部取消</button></p><div class="row" id="tcg"></div><div id="tcl"></div></dialog>
<div class="mask" id="mask"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
</main>
<script>
var DATA=__DAILY_DATA__;var HEAD=__DAILY_HEAD__;var DATE="__DAILY_DATE__";
var MK=["全部","台股","港股","美股","日股"],KD=["全部","ETF","個股"];var mk="全部",kd="全部",sk="total_score",asc=false;
try{var a=localStorage.getItem("dpMk"),b=localStorage.getItem("dpKd");if(MK.indexOf(a)>=0)mk=a;if(KD.indexOf(b)>=0)kd=b}catch(e){}
var dtab="k",TJ={pos:null,play:false,raf:0},CUR=[],VWS=["表格","矩陣","象限","動態"],vw="表格";
try{var vv=localStorage.getItem("dpVw");if(VWS.indexOf(vv)>=0)vw=vv}catch(e){}
var FAV={},favOnly=false,FDB=null,Q=[];
function hit(r){if(!Q.length)return true;var h=[r.ticker,r.name,r.market,r.kind,r.label,r.posture_label,r.combo,r.fib_label,r.long,r.mid,r.short,r.reason].join(" ").toLowerCase();return Q.every(function(k){return h.indexOf(k)>=0})}
try{var fa=JSON.parse(localStorage.getItem("dpFav")||"[]");fa.forEach(function(t){FAV[t]=1});favOnly=localStorage.getItem("dpFavOnly")==="1"}catch(e){}
function favList(){return Object.keys(FAV)}
function saveFav(){try{localStorage.setItem("dpFav",JSON.stringify(favList()));localStorage.setItem("dpFavOnly",favOnly?"1":"0")}catch(e){}if(FDB)FDB.set({t:favList()}).catch(function(){})}
function starB(t){var on=!!FAV[t];return '<button type="button" class="star'+(on?" on":"")+'" data-fav="'+esc(t)+'" aria-pressed="'+on+'" aria-label="'+(on?"取消最愛":"加入最愛")+'" title="'+(on?"取消最愛":"加入最愛")+'">'+(on?"★":"☆")+'</button>'}
var f=function(v,n){return v==null||v===""?"-":Number(v).toFixed(n)};
var sc=function(v){if(v==null)return "-";var c=v>=60?"hi":v<40?"lo":"mid";return '<span class="sc '+c+'">'+Number(v).toFixed(0)+'</span>'};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function btns(list,cur,key,all){return list.map(function(m){var n=all.filter(function(r){return m==="全部"||r[key]===m}).length;return '<button type="button" class="tab" data-k="'+key+'" data-v="'+m+'" aria-pressed="'+(m===cur)+'">'+m+' '+n+'</button>'}).join("")}
function render(){
var base=DATA.filter(function(r){return kd==="全部"||r.kind===kd}),list=DATA.filter(function(r){return (mk==="全部"||r.market===mk)&&(kd==="全部"||r.kind===kd)&&(!favOnly||FAV[r.ticker])&&hit(r)});
document.getElementById("mk").innerHTML=btns(MK,mk,"market",base);
document.getElementById("kd").innerHTML=btns(KD,kd,"kind",DATA.filter(function(r){return mk==="全部"||r.market===mk}));
var nf=DATA.filter(function(r){return FAV[r.ticker]&&(mk==="全部"||r.market===mk)&&(kd==="全部"||r.kind===kd)}).length;document.getElementById("fv").innerHTML='<button type="button" class="tab" data-fvo="1" aria-pressed="'+favOnly+'">★ 只看我的最愛 '+nf+'</button>';
document.getElementById("fvs").textContent=FDB?"最愛已同步到你的帳號":"最愛只存在這個瀏覽器";
document.getElementById("meta").textContent="指標與評分以 "+DATE+" 日線收盤計算　"+mk+"／"+kd+(favOnly?"／最愛":"")+(Q.length?"／搜尋「"+Q.join(" ")+"」":"")+" "+list.length+" 檔";
var w=[];var al=list.filter(function(r){return r.alert});if(al.length)w.push("三週期組合變化提醒："+al.map(function(r){return esc(r.name)+"（"+esc(r.combo)+"）"}).join("、"));
if(HEAD.stale.length)w.push("數據過期：需更新 "+esc(HEAD.stale.join("、")));
var er=list.filter(function(r){return r.state==="ERROR"});if(er.length)w.push("抓取失敗 "+er.length+" 檔："+er.map(function(r){return esc(r.ticker)}).join("、"));
document.getElementById("warn").innerHTML=(w.length?w.map(function(x){return '<div class="warn">'+x+'</div>'}).join(""):"")+(HEAD.macro?'<p class="mac">宏觀指標：'+esc(HEAD.macro)+'</p>':"");
var cnt={};list.forEach(function(r){cnt[r.label]=(cnt[r.label]||0)+1});
document.getElementById("sum").innerHTML=Object.keys(cnt).map(function(k){return '<div class="chip"><b>'+cnt[k]+'</b><span>'+esc(k)+'</span></div>'}).join("");
list.sort(function(x,y){var a=x[sk],b=y[sk];if(a==null&&b==null)return 0;if(a==null)return 1;if(b==null)return -1;var d=typeof a==="string"?a.localeCompare(b):a-b;return asc?d:-d});

posture:{
  t:"配置狀態 (Allocation Status)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>投資組合配置狀態（多軌風控互鎖判定）。依標的策略類型（收息型 ETF、成長型 ETF、債券防禦型 ETF、個股）結合即時殖利率、基本面評分或長線趨勢進行動態分流裁定。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>回答「目前資產部位與現金該執行什麼配置動作？」：</p><ul><li><b>收息型 ETF</b>：指引「🔵 穩健複利」（常態再投入）、「🟢 積極進攻」（高息加碼滾動張數）、「🚨 陷阱警戒」（基本面破底停止進水）、「🟡 防禦觀望」（估值過熱留存現金）。</li><li><b>成長型 ETF</b>：指引「🔵 常態配置」（定期定額累積）、「🔵 趨勢續抱」（多頭核心持有）、「🟢 回檔加碼」（超跌擴大扣款）、「🟠 乖離防禦」（暫停單筆追高）、「⚪ 定額微笑」（空頭紀律扣款）。</li><li><b>債券防禦型 ETF</b>：指引「🟢 積極佈建」（高息具防禦吸引力）、「🔵 穩健配置」（常態穩定器）、「🟡 防禦觀望」（低殖利率暫緩）。</li></ul></div>'
},
close:{
  t:"最新報價 (Latest Price)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>標的最近一個交易日的收盤價，或盤中按頁首「更新最新報價」時向證交所取得之台股盤中即時成交價。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>掌握最新市價水位與今日即時漲跌幅，作為重新計算均線乖離率、52 週區間相對位置、動態 ATR 停損價與最新殖利率之核心基礎。</p></div>'
},
yield:{
  t:"殖利率 (TTM Dividend Yield)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>標的最近 12 個月實際宣告並發放之每股現金股利總和（TTM），除以最新市價計算所得之年化現金殖利率。成長型 ETF 或零配息標的顯示「-」。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>評估收息型資產的實質現金流回報吸引力。協助判斷當前估值是否處於高息便宜區（適合積極滾動雪球）或過熱壓低區（應放緩加碼節奏），避免陷入單純看高殖利率卻忽略基本面惡化的高息陷阱。</p></div>'
},
rsi:{
  t:"RSI14 相對強弱指標 (Relative Strength Index)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>以過去 14 個交易日內收盤「漲幅平均值」與「跌幅平均值」計算出之買賣雙方動能相對強弱比率，數值介於 0 到 100 之間。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>識別短線群眾極端情緒與動能轉折點：</p><ul><li><b>≥ 70（超買過熱區）</b>：短線多方買盤力道強弩之末，容易遭遇短線獲利了結賣壓回檔。</li><li><b>≤ 30（超賣恐慌區）</b>：短線非理性殺盤過度，容易吸引逢低買盤帶動技術性反彈。</li><li><b>30 ~ 70</b>：常態多空拉鋸震盪區間。</li></ul></div>'
},
p52:{
  t:"52 週位置 (52-Week Range Position)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>現價在過去 52 週（約一年）歷史最低價與最高價之間的百分比位置（0% 為 52 週最低價，100% 為 52 週最高價）。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>衡量中長期價格位階：</p><ul><li><b>> 80%（高檔區）</b>：價格逼近一年高點強勢區，但也意味著上檔可能面臨歷史獲利解套壓力，不宜過度追高。</li><li><b>< 20%（低檔區）</b>：價格處於一年底部低檔區，若基本面維持穩健，常為中長線左側佈局或價值投資的低風險好球帶。</li></ul></div>'
},
fib:{
  t:"費波那契位置 (Fibonacci Retracement)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>以近期波段（預設 30 日，可切換 60、120 日）高低點為極值區間，依黃金分割率計算 23.6%、38.2%、50%、61.8%、78.6% 的價格回檔或反彈關卡位置。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>尋找波段拉回時的關鍵支撐防線與多空分水嶺：</p><ul><li><b>回檔 23.6% ~ 38.2%</b>：屬於強勢多頭淺層換手整理，續攻力道最強。</li><li><b>回檔 50% ~ 61.8%</b>：波段多空防守核心中軸，常為絕佳低接切入點。</li><li><b>跌破 78.6%</b>：幾乎整段漲幅吐回，代表原先多頭波段結構可能破壞，應轉為防守。</li></ul></div>'
},
lms:{
  t:"長／中／短期均線 (Multi-Timeframe Trend)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>跨多週期趨勢對齊檢驗：長期（半年線 120MA 與近 1 年報酬率）、中期（季線 60MA）、短期（月線 20MA）各自獨立標定多空強弱等級。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>判斷不同時間尺度的趨勢共振性：</p><ul><li><b>長中短同向（如全強）</b>：大中小週期共振向上，順勢交易勝率最高。</li><li><b>長多短回檔</b>：中長線多頭架構完好，短線震盪拉回反而是優質進場良機。</li><li><b>長空短強</b>：僅屬中長線跌勢中的短線弱勢反彈，不宜重倉追高。</li></ul></div>'
},
combo:{
  t:"三週期組合 (Trend Combination Summary)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>將長、中、短期三週期的排列狀態與強弱等級，組合成一句精煉直觀的白話結構結論（如「共振偏多」、「長多短回檔」、「共振偏空」）。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>提供一眼定調的快速策略結論。協助投資人在數秒內篩選出「大趨勢向上、小回檔找買點」的好球帶標的，或直接過濾掉趨勢向下渙散的弱勢品種。</p></div>'
},
trend:{
  t:"趨勢評分 (Trend Score)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>現價相對於 60 日均線（季線）的乖離率強度換算為 0 到 100 分（50 分為基準線，代表價格恰在季線）。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>評估波段生命線的順勢力道：</p><ul><li><b>> 65 分</b>：中長期多頭趨勢明朗且推升力道強勁。</li><li><b>< 35 分</b>：季線下彎蓋頭，價格處於均線下方，中線空頭壓力沉重。</li></ul></div>'
},
macd:{
  t:"動能評分 (Momentum Score)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>MACD 柱狀體（DIF 快線減去 MACD 慢線）的大小與增減斜率換算為 0 到 100 分（50 分代表柱狀體為零的多空平衡點）。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>捕捉價格推升或殺盤的加速度變化：</p><ul><li>分數自 50 以下向上翻揚代表買盤動能重新點火，適合順勢切入。</li><li>分數自 75 以上高檔下彎代表推升力道已開始放緩，提醒慎防短線震盪。</li></ul></div>'
},
vol:{
  t:"量能評分 (Volume Score)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>短期 5 日均量相對長期 60 日均量的成交量增減比率換算為 0 到 100 分（50 分為常態均量）。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>確認價量配合度與資金參與熱度：</p><ul><li><b>> 70 分</b>：出量攻擊或爆量換手，確認波段突破訊號的真實有效性。</li><li><b>< 30 分</b>：市場量縮觀望、流動性降溫，通常處於無量盤整階段。</li></ul></div>'
},
ret:{
  t:"績效評分 (Return Score)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>近 1 年含息總報酬率（Total Return）在全市場觀察標的池中的相對強度換算為 0 到 100 分。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>實質獲利強弱分水嶺。評估標的過去一年是否具備優異的真賺錢能力，協助投資人嚴格執行「汰弱留強」，避開長期大幅跑輸大盤的停滯資產。</p></div>'
},
total:{
  t:"綜合評分 (Total Composite Score)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>趨勢、動能、量能、績效四項指標評分的等權重平均值（0 到 100 分，50 分為中位持平基準）。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>提供全清單標的「技術面全方位健康度」的客觀排序依據。協助投資人一眼按總分高低排定觀察先後次序，快速挑選出四項維度皆表現優異的前段班標的。</p></div>'
},
stop:{
  t:"2×ATR 停損 (Dynamic Stop Loss)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>近 14 日平均真實波動幅度（ATR14）乘以 2 所計算的動態防守停損價（最新收盤價 − 2×ATR），以及現價到停損點的距離百分比。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>波段操作的客觀風控防線。依照標的自身波動度給予動態呼吸空間，波動大距離寬、波動小距離緊，避免被日常雜訊洗出場；跌破時提醒紀律停損或減碼（長線複利部位不適用）。</p></div>'
},
sr:{
  t:"20 日支撐／壓力 (20-Day Support / Resistance)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>近 20 個交易日的最低成交價（支撐關卡）與最高成交價（壓力關卡）。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>掌握近一個月的箱型整理區間邊界，跌破支撐代表短線破底轉弱，突破壓力代表突破箱型轉強。</p></div>'
},
boll:{
  t:"布林通道 (Bollinger Bands 20, 2)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>以 20 日均線為中線，上下各加減 2 個標準差（涵蓋約 95% 統計機率區間）畫出的動態價格通道。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>價格觸及上緣代表短線極端偏熱，觸及下緣代表極端偏冷，通道變窄代表波動縮小進入壓縮蓄勢。</p></div>'
},
ma20:{
  t:"20 日均線 (20-Day Moving Average / 月線)",
  b:'<div class="h-sec"><div class="h-tit">🔍 這個指標在看什麼？</div><p>最近 20 個交易日收盤價的平均值。</p></div><div class="h-sec"><div class="h-tit">🎯 協助什麼判斷？</div><p>短期趨勢重要參考分水嶺；收盤在月線之上代表短期多方控盤，跌破月線代表短期動能轉弱。</p></div>'
}
};
