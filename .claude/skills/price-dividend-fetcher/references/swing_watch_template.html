<title>波段觀察</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面：上方狀態摘要，下方依需要留意程度排序的觀察清單 */
:root{--bg:#f6f7f5;--fg:#1b2420;--mute:#5d6a63;--line:#d9dfda;--card:#ffffff;--accent:#1f6f54;
--over:#b8641a;--down:#b3372f;--up:#2a6fb0;--over-bg:#fbeedd;--down-bg:#f8e1df;--up-bg:#e1edf8;--none-bg:#eceeec;
--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--fg:#e4eae6;--mute:#93a39a;--line:#2a3630;--card:#18211d;--accent:#5fc19a;
--over:#e8a15c;--down:#ee8a82;--up:#82b7e8;--over-bg:#3a2a18;--down-bg:#3a1e1c;--up-bg:#18293a;--none-bg:#222c27;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111815;--fg:#e4eae6;--mute:#93a39a;--line:#2a3630;--card:#18211d;--accent:#5fc19a;
--over:#e8a15c;--down:#ee8a82;--up:#82b7e8;--over-bg:#3a2a18;--down-bg:#3a1e1c;--up-bg:#18293a;--none-bg:#222c27;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-size:26px;margin:0;letter-spacing:.02em}
.sub{color:var(--mute);margin:4px 0 0;font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 16px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sum{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 14px;display:flex;gap:10px;align-items:baseline}
.chip b{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:720px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mute);letter-spacing:.06em;font-weight:500;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
tr:last-child td{border-bottom:0}
.name small{display:block;color:var(--mute);font:11px var(--mono)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px}
.s-OVERHEATED{background:var(--over-bg);color:var(--over)}.s-DOWNTREND{background:var(--down-bg);color:var(--down)}
.s-UPTREND{background:var(--up-bg);color:var(--up)}.s-OVERSOLD_WATCH{background:var(--up-bg);color:var(--accent)}
.s-NEUTRAL,.s-NO_DATA,.s-ERROR{background:var(--none-bg);color:var(--mute)}
.notes{color:var(--mute);font-size:13px;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.notes p{margin:0}
</style>
<main>
<header><h1>波段觀察</h1><p class="sub" id="meta"></p></header>
<nav class="tabs" id="tabs" aria-label="市場分類"></nav>
<section class="sum" id="sum" aria-label="狀態統計"></section>
<div class="tw"><table><thead><tr><th>標的</th><th>狀態</th><th>收盤</th><th>RSI14</th><th>20日線</th><th>52週位置</th><th>2×ATR停損價</th><th>停損距離</th></tr></thead><tbody id="rows"></tbody></table></div>
<section class="notes">
<p>適用週期為 5 天到 4 週，用日線計算。狀態只描述指標條件，不是買賣指示；進出由你決定，波段部位與股利再投入部位分開記帳。</p>
<p>回測參考（00882 前 15 大成分股、5 年、71 筆）：超跌反彈規則勝率 59.2%、平均 +1.31%，隨機進場基準 +0.49%，未扣手續費與稅，且只測現在的成分股。</p>
<p>資料來源為 Yahoo Finance 日線，盤中更新時當日 K 棒尚未收完。同一份清單在 Drive 的「波段觀察」試算表。</p>
</section>
</main>
<script>
var DATA=__SWING_DATA__;var DATE="__SWING_DATE__";
var order={OVERHEATED:0,DOWNTREND:1,OVERSOLD_WATCH:2,UPTREND:3,NEUTRAL:4,NO_DATA:5,ERROR:6};
var f=function(v,n){return v==null?"-":Number(v).toFixed(n)};
DATA.sort(function(a,b){return order[a.state]-order[b.state]});
var MK=["全部","台股","港股","美股","日股"];var cur="全部";
try{var sv=localStorage.getItem("swingMarket");if(MK.indexOf(sv)>=0)cur=sv}catch(e){}
function render(){
var list=DATA.filter(function(r){return cur==="全部"||r.market===cur});
document.getElementById("meta").textContent="更新日 "+DATE+"　"+cur+" "+list.length+" 檔（個股卡片與 00882 前 15 大成分股）";
document.getElementById("tabs").innerHTML=MK.map(function(m){var n=m==="全部"?DATA.length:DATA.filter(function(r){return r.market===m}).length;
return '<button type="button" class="tab" data-m="'+m+'" aria-pressed="'+(m===cur)+'">'+m+' '+n+'</button>'}).join("");
var cnt={};list.forEach(function(r){cnt[r.label]=(cnt[r.label]||0)+1});
document.getElementById("sum").innerHTML=Object.keys(cnt).map(function(k){return '<div class="chip"><b>'+cnt[k]+'</b><span>'+k+'</span></div>'}).join("");
document.getElementById("rows").innerHTML=list.length?list.map(function(r){
return '<tr><td class="name">'+r.name+'<small>'+r.ticker+' · '+r.market+'</small></td><td><span class="pill s-'+r.state+'" title="'+(r.reason||"")+'">'+r.label+'</span></td><td>'+f(r.close,2)+'</td><td>'+f(r.rsi14,1)+'</td><td>'+f(r.sma20,2)+'</td><td>'+f(r.pos_52w_pct,0)+'%</td><td>'+f(r.stop_price,2)+'</td><td>-'+f(r.stop_distance_pct,1)+'%</td></tr>'}).join(""):'<tr><td colspan="8" style="text-align:center;color:var(--mute)">此市場目前沒有觀察標的。個股卡片或成分股加入後會出現在這裡。</td></tr>';}
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(!b)return;cur=b.dataset.m;try{localStorage.setItem("swingMarket",cur)}catch(x){}render()});
render();
</script>
