name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * *"   # UTC 12:00 = 台北 20:00，排程時只跑 schedule-health
  workflow_dispatch:

jobs:
  markdown-lint:
    name: markdown-lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: PR 規則掃描段落備援檢查（動到 .claude/、CLAUDE.md、AGENT.md 時必填）
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" || true)
          NEED_CHECK=0
          for f in $CHANGED; do
            case "$f" in
              .claude/*|CLAUDE.md|.agent/rules/AGENT.md|AGENT.md)
                NEED_CHECK=1
                break
                ;;
            esac
          done
          if [ "$NEED_CHECK" -eq 1 ]; then
            if ! printf '%s' "$PR_BODY" | grep -q "規則掃描"; then
              echo "::error::PR 變更包含 .claude/、CLAUDE.md 或 AGENT.md，但 PR 描述缺少「規則掃描」段落。"
              exit 1
            fi
            echo "✅ PR 描述已包含「規則掃描」段落。"
          else
            echo "ℹ️ 未變更 .claude/、CLAUDE.md 或 AGENT.md，略過規則掃描段落檢查。"
          fi
      - name: markdownlint（.markdownlint-cli2.jsonc）
        run: python3 .claude/skills/markdown-linter/scripts/mdlint.py

  skill-tests:
    name: skill-tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install pytest beautifulsoup4 requests pyyaml yfinance google-auth
      - name: pytest（.claude/skills/*/tests）
        run: python -m pytest -q --durations=15 .claude/skills

  schedule-health:
    name: schedule-health
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 排程健康檢查（swing-patrol、market-etf 近期有如期成功）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .claude/skills/fin-commit/scripts/schedule_health.py

  auto-merge:
    name: auto-merge
    needs: [markdown-lint, skill-tests]
    if: >-
      github.event_name == 'pull_request'
      && (startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'agy/'))
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 草稿 PR 先轉為 Ready（雲端工作階段一律先開草稿；已是 Ready 則無動作）
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
        run: gh pr ready "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
      - name: 以 merge commit 合併（用 PAT，合併後才會觸發 main 的 CI）
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --merge --delete-branch
