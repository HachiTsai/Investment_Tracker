name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown-lint:
    name: markdown-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: markdownlint（.markdownlint-cli2.jsonc）
        run: python3 .claude/skills/markdown-linter/scripts/mdlint.py

  skill-tests:
    name: skill-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install pytest beautifulsoup4 requests pyyaml yfinance
      - name: pytest（.claude/skills/*/tests）
        run: python -m pytest -q --durations=15 .claude/skills

  auto-merge:
    name: auto-merge
    needs: [markdown-lint, skill-tests]
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.head_ref, 'claude/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 草稿 PR 先轉為 Ready（雲端工作階段一律先開草稿；已是 Ready 則無動作）
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
        run: gh pr ready "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
      - name: 以 merge commit 合併（用 PAT，合併後才會觸發 main 的 CI）
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --merge --delete-branch
