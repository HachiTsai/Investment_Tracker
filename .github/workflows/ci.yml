name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown-lint:
    name: markdown-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: markdownlint（.markdownlint-cli2.jsonc）
        run: python3 .claude/skills/markdown-linter/scripts/mdlint.py

  skill-tests:
    name: skill-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest
      - name: pytest（.claude/skills/*/tests）
        run: python -m pytest -q .claude/skills
