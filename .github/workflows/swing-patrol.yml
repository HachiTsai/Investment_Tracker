name: Swing Patrol Sheets Sync

on:
  schedule:
    # 每個平日台北 17:00 (UTC 09:00, Mon-Fri)
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  sync-swing-sheets:
    name: Sync Swing Patrol to Google Sheets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install pytest beautifulsoup4 requests pyyaml yfinance google-auth
      - name: Run Swing Sync Pipeline
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python3 .claude/skills/price-dividend-fetcher/scripts/swing_sync.py
